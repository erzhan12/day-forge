title = "Betterleaks"
description = "Extends the built-in rules and adds Telegram Bot API token detection (the default rules miss these tokens)."

[extend]
useDefault = true

[[rules]]
id = "telegram-bot-token"
description = "Telegram Bot API token"
# Boundaries use the token alphabet so a match cannot start or end inside a longer identifier.
regex = '''(?:^|[^A-Za-z0-9_-])([0-9]{8,10}:[A-Za-z0-9_-]{35,})(?:[^A-Za-z0-9_-]|$)'''
valueGroup = 1
confidence = "high"
