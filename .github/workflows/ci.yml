name: CI

on:
  pull_request:
  workflow_call:
    inputs:
      skip_prod_audit:
        description: Skip npm prod audit for an emergency manual deployment
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # Security invariant (issue #194): the deploy job must never regress the
      # SSH host-key pin. The regex anchors on a command position so this step's
      # own prose/echoes that name the forbidden tool don't self-trip. A swap to
      # a non-strict option (e.g. accept-new) is caught by the strict==total gate
      # below, since it drops the strict count. PRs and deployment use this
      # same gate; a failure blocks validation and the build/push/deploy chain.
      - name: Verify deploy SSH host-key pinning invariant
        run: |
          f=.github/workflows/deploy.yml
          if grep -Eq '^[[:space:]]*(run:[[:space:]]+)?ssh-keyscan[[:space:]]' "$f"; then
            echo "::error::deploy.yml reintroduced a runtime ssh-keyscan (TOFU)"; exit 1
          fi
          total=$(grep -cE '^[[:space:]]+(ssh|scp)[[:space:]]' "$f" || true)
          strict=$(grep -cE '^[[:space:]]+(ssh|scp)[[:space:]].*StrictHostKeyChecking=yes.*UserKnownHostsFile=\$HOME/\.ssh/known_hosts' "$f" || true)
          echo "ssh/scp invocations: ${total:-0}; strict+pinned: ${strict:-0}"
          if [ "${strict:-0}" -ne "${total:-0}" ] || [ "${total:-0}" -eq 0 ]; then
            echo "::error::not every ssh/scp carries StrictHostKeyChecking=yes + UserKnownHostsFile"; exit 1
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2

      - name: Set up Python
        run: uv python install 3.14

      - name: Install backend deps
        run: uv sync --frozen

      # Run lint before pytest to fail early. Deployment's build-and-push
      # job waits for this shared validation job.
      - name: Run backend lint
        run: uv run ruff check backend/

      - name: Run backend tests
        # AI rate-limit tests assume LocMemCache (conftest pins it); leave
        # LLM_API_KEY unset so ai.E001 does not require Redis in CI.
        run: uv run pytest backend/tests/ -q

      - name: Test deployment image retention
        run: bash deployment/tests/test_image_retention.sh

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      # Fail-closed security gate: blocks the deploy if any high/critical
      # advisory hits the prod dependency graph (see docs/features/0102_REVIEW.md).
      # EMERGENCY BYPASS (backend-only hotfix blocked by an unresolvable frontend
      # advisory): manually dispatch deploy.yml with skip_prod_audit=true. Deploy
      # passes that input to this reusable workflow through workflow_call. This
      # leaves an audit trail and re-engages the gate automatically on the next push.
      - name: Frontend prod audit
        if: ${{ !(github.event_name == 'workflow_call' && inputs.skip_prod_audit) }}
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

      - name: Frontend type-check + tests
        working-directory: frontend
        run: |
          npm run type-check
          npm test

      - name: Frontend production build
        working-directory: frontend
        run: npm run build
