name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_prod_audit:
        description: 'Skip npm prod audit (EMERGENCY only — open follow-up to restore)'
        type: boolean
        default: false

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/day-forge

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # Security invariant (issue #194): the deploy job must never regress the
      # SSH host-key pin. The regex anchors on a command position so this step's
      # own prose/echoes that name the forbidden tool don't self-trip. A swap to
      # a non-strict option (e.g. accept-new) is caught by the strict==total gate
      # below, since it drops the strict count. This runs in the `test` job on
      # every push to main and workflow_dispatch (the Deploy workflow does not
      # trigger on pull_request); a failure blocks the whole build/push/deploy
      # chain. Pre-merge (PR-time) enforcement is a deferred follow-up.
      - name: Verify deploy SSH host-key pinning invariant
        run: |
          f=.github/workflows/deploy.yml
          if grep -Eq '^[[:space:]]*(run:[[:space:]]+)?ssh-keyscan[[:space:]]' "$f"; then
            echo "::error::deploy.yml reintroduced a runtime ssh-keyscan (TOFU)"; exit 1
          fi
          total=$(grep -cE '^[[:space:]]+(ssh|scp)[[:space:]]' "$f" || true)
          strict=$(grep -cE '^[[:space:]]+(ssh|scp)[[:space:]].*StrictHostKeyChecking=yes.*UserKnownHostsFile=\$HOME/\.ssh/known_hosts' "$f" || true)
          echo "ssh/scp invocations: ${total:-0}; strict+pinned: ${strict:-0}"
          if [ "${strict:-0}" -ne "${total:-0}" ] || [ "${total:-0}" -eq 0 ]; then
            echo "::error::not every ssh/scp carries StrictHostKeyChecking=yes + UserKnownHostsFile"; exit 1
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1

      - name: Set up Python
        run: uv python install 3.14

      - name: Install backend deps
        run: uv sync --frozen

      # Backend lint gate (issue #137): identical command to README's
      # documented backend lint. Placed before pytest so a lint failure
      # fails the job fast and gates the whole downstream build/push/deploy
      # chain (build-and-push needs: test).
      - name: Run backend lint
        run: uv run ruff check backend/

      - name: Run backend tests
        # AI rate-limit tests assume LocMemCache (conftest pins it); leave
        # LLM_API_KEY unset so ai.E001 does not require Redis in CI.
        run: uv run pytest backend/tests/ -q

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      # Fail-closed security gate: blocks the deploy if any high/critical
      # advisory hits the prod dependency graph (see docs/features/0102_REVIEW.md).
      # EMERGENCY BYPASS (backend-only hotfix blocked by an unresolvable frontend
      # advisory): trigger a manual `workflow_dispatch` run with skip_prod_audit=true.
      # This leaves an audit trail in the Actions history and re-engages the gate
      # automatically on the next push. Then open a follow-up to patch the dep.
      - name: Frontend prod audit
        if: ${{ !inputs.skip_prod_audit }}
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

      - name: Frontend type-check + tests
        working-directory: frontend
        run: |
          npm run type-check
          npm test

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0

      - name: Compute tags
        id: meta
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          file: deployment/docker/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install SSH key
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555  # v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Pin SSH host key
        env:
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          test -n "$SSH_KNOWN_HOSTS"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          test -s "$HOME/.ssh/known_hosts"

      - name: Copy deployment files to droplet
        env:
          SSH_TARGET: ${{ secrets.SSH_USER }}@${{ secrets.SERVER_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          # One-time host prep (deploy owns DEPLOY_PATH; data/staticfiles uid 1000) — deployment/README.md §3b.
          ssh -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$HOME/.ssh/known_hosts" "$SSH_TARGET" "mkdir -p \"$DEPLOY_PATH/data\" \"$DEPLOY_PATH/staticfiles\""
          scp -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$HOME/.ssh/known_hosts" deployment/docker/docker-compose.yml "$SSH_TARGET:$DEPLOY_PATH/docker-compose.yml"

      - name: Write .env, pull image, restart stack
        env:
          SSH_TARGET: ${{ secrets.SSH_USER }}@${{ secrets.SERVER_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          IMAGE_REF: ${{ env.IMAGE }}:${{ needs.build-and-push.outputs.image_tag }}
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          ALLOWED_HOSTS: ${{ secrets.ALLOWED_HOSTS }}
          CSRF_TRUSTED_ORIGINS: ${{ secrets.CSRF_TRUSTED_ORIGINS }}
          CALDAV_ENCRYPTION_KEY: ${{ secrets.CALDAV_ENCRYPTION_KEY }}
          TODOIST_ENCRYPTION_KEY: ${{ secrets.TODOIST_ENCRYPTION_KEY }}
          HABITICA_ENCRYPTION_KEY: ${{ secrets.HABITICA_ENCRYPTION_KEY }}
          HABITICA_CLIENT_ID: ${{ secrets.HABITICA_CLIENT_ID }}
          EXTERNAL_TASKS_POLL_INTERVAL_SECONDS: ${{ secrets.EXTERNAL_TASKS_POLL_INTERVAL_SECONDS }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REDIRECT_URI: ${{ secrets.GOOGLE_OAUTH_REDIRECT_URI }}
          GOOGLE_OAUTH_TOKEN_KEY: ${{ secrets.GOOGLE_OAUTH_TOKEN_KEY }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          LLM_DRAFT_MODEL: ${{ secrets.LLM_DRAFT_MODEL }}
          DJANGO_SUPERUSER_USERNAME: ${{ secrets.DJANGO_SUPERUSER_USERNAME }}
          DJANGO_SUPERUSER_EMAIL: ${{ secrets.DJANGO_SUPERUSER_EMAIL }}
          DJANGO_SUPERUSER_PASSWORD: ${{ secrets.DJANGO_SUPERUSER_PASSWORD }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          # Build .env via Python — never interpolate secrets inside double-quoted shell
          # echo (metacharacters in DJANGO_SUPERUSER_PASSWORD etc. break or inject).
          python3 <<'PY'
          import os, sys

          def require(name: str) -> str:
              value = os.environ.get(name, "")
              if not value:
                  sys.exit(f"missing required env var: {name}")
              if "\n" in value or "\r" in value:
                  sys.exit(f"{name} must not contain newlines")
              return value

          def optional(name: str) -> str | None:
              """Unset secret -> omit the line entirely (settings.py default applies).

              Distinct from ``require``: an unset optional must not fail the
              deploy, but an explicitly-set one (e.g. the poll interval pinned
              to ``0`` to keep background polling off) must reach the droplet.
              """
              value = os.environ.get(name, "")
              if not value:
                  return None
              if "\n" in value or "\r" in value:
                  sys.exit(f"{name} must not contain newlines")
              return value

          def dotenv_line(key: str, value: str, *, quote: bool = True) -> str:
              """Single-quoted values: Compose env_file does not expand $ inside quotes."""
              if not quote:
                  return f"{key}={value}"
              escaped = value.replace("'", "\\'")  # Compose: only ' is escaped inside '...'; \ is literal
              return f"{key}='{escaped}'"

          lines = [
              "DEBUG=0",
              dotenv_line("DJANGO_SECRET_KEY", require("DJANGO_SECRET_KEY")),
              dotenv_line("ALLOWED_HOSTS", require("ALLOWED_HOSTS")),
              dotenv_line("CSRF_TRUSTED_ORIGINS", require("CSRF_TRUSTED_ORIGINS")),
              dotenv_line("CALDAV_ENCRYPTION_KEY", require("CALDAV_ENCRYPTION_KEY")),
              dotenv_line("TODOIST_ENCRYPTION_KEY", require("TODOIST_ENCRYPTION_KEY")),
              # Required: habitica_sync.E001 blocks DEBUG=0 boot without both,
              # and this file REPLACES the droplet's .env wholesale, so a var
              # omitted here is erased rather than preserved.
              dotenv_line("HABITICA_ENCRYPTION_KEY", require("HABITICA_ENCRYPTION_KEY")),
              dotenv_line("HABITICA_CLIENT_ID", require("HABITICA_CLIENT_ID")),
              dotenv_line("GOOGLE_OAUTH_CLIENT_ID", require("GOOGLE_OAUTH_CLIENT_ID")),
              dotenv_line("GOOGLE_OAUTH_CLIENT_SECRET", require("GOOGLE_OAUTH_CLIENT_SECRET")),
              dotenv_line("GOOGLE_OAUTH_REDIRECT_URI", require("GOOGLE_OAUTH_REDIRECT_URI")),
              dotenv_line("GOOGLE_OAUTH_TOKEN_KEY", require("GOOGLE_OAUTH_TOKEN_KEY")),
              dotenv_line("LLM_API_KEY", require("LLM_API_KEY")),
              dotenv_line("LLM_BASE_URL", require("LLM_BASE_URL")),
              dotenv_line("LLM_MODEL", require("LLM_MODEL")),
              dotenv_line("LLM_DRAFT_MODEL", require("LLM_DRAFT_MODEL")),
              dotenv_line("DJANGO_SUPERUSER_USERNAME", require("DJANGO_SUPERUSER_USERNAME")),
              dotenv_line("DJANGO_SUPERUSER_EMAIL", require("DJANGO_SUPERUSER_EMAIL")),
              dotenv_line("DJANGO_SUPERUSER_PASSWORD", require("DJANGO_SUPERUSER_PASSWORD")),
              dotenv_line("DOCKER_IMAGE", require("IMAGE_REF")),
          ]

          # Optional: unset -> settings.py default (10s). Set to 0 to keep
          # background polling off, which deployment/README.md documents as the
          # opt-out and which only works if the value actually reaches the .env.
          _poll = optional("EXTERNAL_TASKS_POLL_INTERVAL_SECONDS")
          if _poll is not None:
              lines.append(
                  dotenv_line("EXTERNAL_TASKS_POLL_INTERVAL_SECONDS", _poll)
              )
          path = "/tmp/day-forge.env"
          with open(path, "w", encoding="utf-8") as f:
              f.write("\n".join(lines) + "\n")
          PY
          scp -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$HOME/.ssh/known_hosts" /tmp/day-forge.env "$SSH_TARGET:$DEPLOY_PATH/.env"
          rm -f /tmp/day-forge.env
          ssh -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$HOME/.ssh/known_hosts" "$SSH_TARGET" "grep -q '^DEBUG=0$' '$DEPLOY_PATH/.env'"
          ssh -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$HOME/.ssh/known_hosts" "$SSH_TARGET" "bash -s" <<EOF
          set -e
          cd "$DEPLOY_PATH"
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          export DOCKER_IMAGE="$IMAGE_REF"
          docker compose pull
          docker compose up -d --remove-orphans
          docker image prune -f
          EOF

  health-check:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Wait for stabilization
        run: sleep 30

      - name: Probe HTTPS endpoint
        run: |
          for i in $(seq 1 5); do
            code=$(curl -s -o /dev/null -w "%{http_code}" https://dayforge.habitreward.org/accounts/login/ || true)
            echo "attempt $i: HTTP $code"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 10
          done
          echo "health check failed"; exit 1
