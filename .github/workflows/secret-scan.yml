name: secret-scan

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  secret-scan:
    name: betterleaks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history is required for --revision ranges.
          fetch-depth: 0

      - name: Determine scan range
        id: range
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          ZERO="0000000000000000000000000000000000000000"
          ARGS_FILE="${RUNNER_TEMP}/betterleaks-args"
          COMMITS_FILE="${RUNNER_TEMP}/betterleaks-commits"

          fallback_range() {
            if [ -n "${DEFAULT_BRANCH}" ] \
              && git rev-parse --verify "origin/${DEFAULT_BRANCH}" >/dev/null 2>&1 \
              && [ "$(git rev-parse "origin/${DEFAULT_BRANCH}")" != "${HEAD_SHA}" ]; then
              printf '%s\n' "--revision=origin/${DEFAULT_BRANCH}..${HEAD_SHA}" > "${ARGS_FILE}"
            else
              printf '%s\n' "${HEAD_SHA}" > "${COMMITS_FILE}"
              printf '%s\n' "--commit-list-file=/range/betterleaks-commits" > "${ARGS_FILE}"
            fi
          }

          if [ "${EVENT_NAME}" = "pull_request" ]; then
            printf '%s\n' "--revision=origin/${BASE_REF}..HEAD" > "${ARGS_FILE}"
          elif [ -n "${BEFORE_SHA}" ] \
            && [ "${BEFORE_SHA}" != "${ZERO}" ] \
            && git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            printf '%s\n' "--revision=${BEFORE_SHA}..${HEAD_SHA}" > "${ARGS_FILE}"
          else
            fallback_range
          fi

          echo "Scanning with: $(cat "${ARGS_FILE}")"

      - name: Scan for secrets
        # /range maps to ${RUNNER_TEMP} via the volume mount below.
        run: |
          set -euo pipefail
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e GIT_CONFIG_COUNT=1 \
            -e GIT_CONFIG_KEY_0=safe.directory \
            -e GIT_CONFIG_VALUE_0='*' \
            --volume "${GITHUB_WORKSPACE}:/repo:ro" \
            --volume "${RUNNER_TEMP}:/range:ro" \
            --workdir /repo \
            --entrypoint bash \
            ghcr.io/betterleaks/betterleaks:v2.0.0-rc.9@sha256:4258956e745465a9a0a8b71157d30ae9492d58a683934a69e432616f7f166daf \
            -c 'set -euo pipefail
              extra_args=()
              while IFS= read -r line || [ -n "$line" ]; do
                [ -n "$line" ] || continue
                extra_args+=("$line")
              done < /range/betterleaks-args
              count=0
              for a in "${extra_args[@]}"; do
                case "$a" in
                  --revision=*)
                    count=$(git rev-list --count "${a#--revision=}")
                    ;;
                  --commit-list-file=*)
                    count=$(grep -c . "${a#--commit-list-file=}" || true)
                    ;;
                esac
              done
              echo "Commits scanned: ${count}"
              if [ "$count" -eq 0 ]; then
                echo "error: scan range selected 0 commits" >&2
                exit 1
              fi
              exec betterleaks git . --redact --no-banner --config /repo/.betterleaks.toml "${extra_args[@]}"
            '
