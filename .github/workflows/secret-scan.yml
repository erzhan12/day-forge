name: secret-scan

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  secret-scan:
    name: betterleaks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Determine scan range
        id: range
        run: |
          set -euo pipefail
          ZERO="0000000000000000000000000000000000000000"
          ARGS_FILE="${RUNNER_TEMP}/betterleaks-args"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            printf '%s\n' "--revision=origin/${{ github.base_ref }}..HEAD" > "$ARGS_FILE"
          elif [ "${{ github.event.before }}" != "$ZERO" ]; then
            printf '%s\n' "--revision=${{ github.event.before }}..${{ github.sha }}" > "$ARGS_FILE"
          else
            sha="${{ github.sha }}"
            default_branch="${{ github.event.repository.default_branch }}"
            if [ -n "$default_branch" ] \
              && git rev-parse --verify "origin/${default_branch}" >/dev/null 2>&1 \
              && [ "$(git rev-parse "origin/${default_branch}")" != "$sha" ]; then
              printf '%s\n' "--revision=origin/${default_branch}..${sha}" > "$ARGS_FILE"
            else
              printf '%s\n' "$sha" > "${RUNNER_TEMP}/betterleaks-commits"
              printf '%s\n' "--commit-list-file=/range/betterleaks-commits" > "$ARGS_FILE"
            fi
          fi
          echo "Scanning with: $(cat "$ARGS_FILE")"

      - name: Scan for secrets
        run: |
          set -euo pipefail
          mapfile -t extra_args < "${RUNNER_TEMP}/betterleaks-args"
          docker run --rm \
            --volume "${GITHUB_WORKSPACE}:/repo:ro" \
            --volume "${RUNNER_TEMP}:/range:ro" \
            --workdir /repo \
            ghcr.io/betterleaks/betterleaks:v2.0.0-rc.9@sha256:4258956e745465a9a0a8b71157d30ae9492d58a683934a69e432616f7f166daf \
            git . --redact --no-banner --config /repo/.betterleaks.toml "${extra_args[@]}"
