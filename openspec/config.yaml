schema: spec-driven

# Day Forge uses OpenSpec in hybrid mode. docs/features/NNNN_PLAN.md stays the
# design document; the matching change openspec/changes/NNNN-slug/ carries the
# proposal pointer, spec deltas and the implementation checklist. See
# docs/features/README.md for the full workflow.
context: |
  Day Forge: Django 5 / Python 3.14 (uv) backend, Vue 3 + TypeScript + Inertia frontend, SQLite.
  RULES.md holds mutation, concurrency, privacy and security invariants; specs must not contradict it.
  docs/api.md is the API contract; docs/ARCHITECTURE.md maps module ownership.
  Never edit tracked files on main; changes are archived on the feature branch before the fast-forward merge.
  Task, calendar and Habitica text never reaches the LLM provider; do not specify behavior that would send it.

rules:
  proposal:
    - Name the change NNNN-slug, matching the feature number of docs/features/NNNN_PLAN.md
    - Link to docs/features/NNNN_PLAN.md for design and trade-offs instead of copying them
    - Keep the proposal to Why, What changes, Capabilities and Impact
  design:
    - Skip design.md when docs/features/NNNN_PLAN.md already records the design; point to it instead
  specs:
    - Describe observable current behavior, not intentions or implementation steps
    - Keep each requirement body under 500 characters; put the SHALL or MUST sentence first
    - Add an "Enforced:" line naming the owning code as path::Symbol
    - Add a "Tests:" line under each scenario naming real tests as path::Class::test or path::test; omit it rather than invent one
  tasks:
    - tasks.md is the per-feature checklist; tasks/todo.md keeps only cross-feature open decisions
    - End with running make check, make spec-check and make frontend-build

operations:
  archive:
    guidance:
      - Archive on the feature branch before the fast-forward merge, never on main
      - Run make spec-check after archiving
